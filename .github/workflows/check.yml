# Validates the app files, builds the package and runs AppInspect on it.
# Runs on pushes to main and on pull requests; release.yml also calls it to build
# the package it publishes, which it uploads as the "package" artifact.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  # Pinned so a new AppInspect release can't start failing checks unannounced.
  APPINSPECT_VERSION: "4.3.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate app files
        run: python3 scripts/validate.py

      - name: Build package
        id: pack
        run: echo "path=$(bash scripts/pack.sh)" >> "$GITHUB_OUTPUT"

      - name: Install AppInspect
        run: |
          # AppInspect needs libmagic, which the runner image usually has.
          dpkg -s libmagic1 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libmagic1; }
          python3 -m pip install "splunk-appinspect==$APPINSPECT_VERSION"

      - name: Run AppInspect
        env:
          PACKAGE: ${{ steps.pack.outputs.path }}
        run: |
          set +e
          splunk-appinspect inspect "$PACKAGE" --mode precert --included-tags cloud --ci \
            --data-format json --output-file dist/appinspect.json
          code=$?
          set -e
          python3 scripts/appinspect_summary.py dist/appinspect.json
          # With --ci: 0 = all passed, 103 = warnings, 104 = future failures. Both are allowed
          # (check_for_updates always warns); failures (101) and errors (1-3) fail the check.
          case "$code" in
            0|103|104) ;;
            *) echo "::error::AppInspect exited with code $code"; exit 1 ;;
          esac

      - name: Upload package
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            ${{ steps.pack.outputs.path }}
            dist/appinspect.json
          if-no-files-found: error
